; priority=90
; Saan container: values from the installation manual (section 2) plus production defaults
memory_limit = 512M
post_max_size = 16M
upload_max_filesize = 12M
max_execution_time = 120
max_input_vars = 3000
expose_php = Off
display_errors = Off
log_errors = On
date.timezone = Asia/Bangkok
session.cookie_httponly = 1
session.use_strict_mode = 1
; the built-in updater swaps files in place: OPcache must notice changed files
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
