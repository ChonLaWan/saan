# Example only. Replace paths, domain, certificates and the PHP-FPM socket.
server {
    listen 80;
    server_name school.example;
    return 301 https://school.example$request_uri;
}
server {
    listen 443 ssl;
    server_name school.example;
    root /var/www/saan/public;
    index index.php;
    ssl_certificate /etc/letsencrypt/live/school.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/school.example/privkey.pem;
    charset utf-8;
    client_max_body_size 12m;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }
    location ~ /\.(?!well-known).* { deny all; }
    location ~* ^/(?:vendor|storage|resources|installer|config|database)/ { deny all; }
}
