# Example only. Replace paths, domain and certificates. DocumentRoot must be public/.
# A standard (two-app) install needs two of these: one for the internal app and one for the public site, on two different host names (see the manual, section 6).
<VirtualHost *:80>
    ServerName school.example
    Redirect permanent / https://school.example/
</VirtualHost>
<VirtualHost *:443>
    ServerName school.example
    DocumentRoot /var/www/saan/public
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/school.example/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/school.example/privkey.pem
    <Directory /var/www/saan/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
    ErrorLog ${APACHE_LOG_DIR}/school-error.log
    CustomLog ${APACHE_LOG_DIR}/school-access.log combined
</VirtualHost>
