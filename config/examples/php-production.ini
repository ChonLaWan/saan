; Example values; apply to the website PHP-FPM pool or hosting PHP settings.
display_errors = Off
log_errors = On
memory_limit = 256M
upload_max_filesize = 12M
post_max_size = 16M
max_execution_time = 120
session.cookie_httponly = 1
session.cookie_samesite = Strict
; Enable session.cookie_secure only on HTTPS; installer handles localhost separately.
